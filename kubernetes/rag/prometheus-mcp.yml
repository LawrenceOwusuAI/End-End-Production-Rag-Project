apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus-mcp
  namespace: rag

spec:

  replicas: 1

  selector:
    matchLabels:
      app: prometheus-mcp

  template:

    metadata:
      labels:
        app: prometheus-mcp

    spec:

      containers:

        - name: prometheus-mcp

          image: lawrenceowusuml/prometheus-mcp:518d6994b382

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 8001

          envFrom:

            - configMapRef:
                name: rag-config

            - secretRef:
                name: rag-secrets

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:

            tcpSocket:
              port: 8001

            periodSeconds: 10


---

apiVersion: v1
kind: Service

metadata:
  name: prometheus-mcp
  namespace: rag

spec:

  type: ClusterIP

  selector:
    app: prometheus-mcp

  ports:

    - name: http

      port: 8001

      targetPort: 8001


---

apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: rag

spec:

  type: ExternalName

  externalName: kube-prometheus-stack-prometheus.monitoring.svc.cluster.local

  ports:

    - port: 9090
      targetPort: 9090