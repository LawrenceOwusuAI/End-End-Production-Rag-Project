apiVersion: apps/v1
kind: Deployment

metadata:
  name: rag-frontend
  namespace: rag
  annotations:
    gitops-test: "enabled"

spec:

  replicas: 1

  selector:
    matchLabels:
      app: rag-frontend

  template:

    metadata:
      labels:
        app: rag-frontend

    spec:

      containers:

        - name: rag-frontend

          image: lawrenceowusuml/rag-frontend:1.0

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 8501

          envFrom:

            - configMapRef:
                name: rag-config

            - secretRef:
                name: rag-secrets

          resources:

            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"

          readinessProbe:

            httpGet:
              path: /_stcore/health
              port: 8501

            initialDelaySeconds: 10
            periodSeconds: 15

          livenessProbe:

            httpGet:
              path: /_stcore/health
              port: 8501

            initialDelaySeconds: 30
            periodSeconds: 30


---

apiVersion: v1
kind: Service

metadata:
  name: rag-frontend
  namespace: rag

spec:

  type: NodePort

  selector:
    app: rag-frontend

  ports:

    - name: http

      port: 8501

      targetPort: 8501

      nodePort: 30501