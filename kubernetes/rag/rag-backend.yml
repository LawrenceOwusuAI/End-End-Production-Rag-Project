apiVersion: apps/v1
kind: Deployment

metadata:
  name: rag-backend
  namespace: rag

spec:

  replicas: 1

  selector:
    matchLabels:
      app: rag-backend

  template:

    metadata:
      labels:
        app: rag-backend

    spec:

      containers:

        - name: rag-backend

          image: lawrenceowusuml/rag-backend:518d6994b382

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 8000

          envFrom:

            - configMapRef:
                name: rag-config

            - secretRef:
                name: rag-secrets

          resources:

            requests:
              cpu: "500m"
              memory: "2Gi"

            limits:
              cpu: "2"
              memory: "6Gi"


          startupProbe:

            exec:
              command:
                - python
                - -c
                - |
                  import json, urllib.request
                  d=json.load(
                    urllib.request.urlopen(
                      "http://127.0.0.1:8000/health"
                    )
                  )
                  raise SystemExit(
                    0 if d.get("status") == "healthy" else 1
                  )

            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60


          readinessProbe:

            exec:
              command:
                - python
                - -c
                - |
                  import json, urllib.request
                  d=json.load(
                    urllib.request.urlopen(
                      "http://127.0.0.1:8000/health"
                    )
                  )
                  raise SystemExit(
                    0 if d.get("status") == "healthy" else 1
                  )

            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4


          livenessProbe:

            httpGet:
              path: /health
              port: 8000

            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5


---

apiVersion: v1
kind: Service

metadata:
  name: rag-backend
  namespace: rag

spec:

  type: ClusterIP

  selector:
    app: rag-backend

  ports:

    - name: http
      port: 8000
      targetPort: 8000