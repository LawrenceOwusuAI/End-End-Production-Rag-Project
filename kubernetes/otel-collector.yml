apiVersion: v1
kind: ConfigMap

metadata:
  name: otel-collector-config
  namespace: rag

data:

  config.yml: |

    receivers:

      otlp:

        protocols:

          http:
            endpoint: 0.0.0.0:4318


    processors:

      memory_limiter:
        check_interval: 5s
        limit_mib: 256
        spike_limit_mib: 64

      batch:
        timeout: 5s
        send_batch_size: 1024


    exporters:

      prometheus:

        endpoint: 0.0.0.0:9464

        enable_open_metrics: true


      debug:

        verbosity: basic


    service:

      pipelines:

        metrics:

          receivers:
            - otlp

          processors:
            - memory_limiter
            - batch

          exporters:
            - prometheus
            - debug


---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: otel-collector
  namespace: rag

spec:

  replicas: 1

  selector:
    matchLabels:
      app: otel-collector

  template:

    metadata:
      labels:
        app: otel-collector

    spec:

      containers:

        - name: otel-collector

          image: otel/opentelemetry-collector-contrib:latest

          args:

            - "--config=/etc/otelcol-contrib/config.yml"

          ports:

            - name: otlp-http
              containerPort: 4318

            - name: prometheus
              containerPort: 9464

          volumeMounts:

            - name: config

              mountPath: /etc/otelcol-contrib/config.yml

              subPath: config.yml

          resources:

            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:

            tcpSocket:
              port: 4318

            periodSeconds: 10


      volumes:

        - name: config

          configMap:
            name: otel-collector-config


---

apiVersion: v1
kind: Service

metadata:

  name: otel-collector
  namespace: rag

  labels:

    app: otel-collector

    monitoring-job: rag-otel

spec:

  type: ClusterIP

  selector:
    app: otel-collector

  ports:

    - name: otlp-http

      port: 4318

      targetPort: 4318


    - name: prometheus

      port: 9464

      targetPort: 9464