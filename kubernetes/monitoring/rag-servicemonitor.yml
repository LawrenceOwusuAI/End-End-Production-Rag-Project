apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-otel-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobLabel: monitoring-job
  namespaceSelector:
    matchNames:
      - rag
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s