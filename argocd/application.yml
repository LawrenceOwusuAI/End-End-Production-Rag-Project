apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: production-rag
  namespace: argocd

spec:
  project: production-rag

  source:
    repoURL: "https://github.com/LawrenceOwusuAI/End-End-Production-Rag-Project.git"
    targetRevision: main
    path: kubernetes

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: rag

  syncPolicy:
    syncOptions:
      - CreateNamespace=true