apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: production-rag
  namespace: argocd

spec:
  project: production-rag

  source:
    repoURL: https://github.com/LawrenceOwusuAI/End-End-Production-Rag-Project.git
    targetRevision: main
    path: helm/production-rag

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: rag

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true