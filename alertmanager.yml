global:
  resolve_timeout: 5m


route:

  receiver: observability-agent

  group_by:
    - alertname
    - service
    - severity

  group_wait: 15s
  group_interval: 5m
  repeat_interval: 30m


receivers:

  - name: observability-agent

    webhook_configs:

      - url: "http://observability-agent:8003/alerts/prometheus"

        send_resolved: true