name: Production RAG CI/CD GitOps


# TRIGGERS


on:
  push:
    branches:
      - main

    # Prevent the GitOps manifest commit created by this workflow
    # from triggering another full image build.
    paths-ignore:
      - "kubernetes/**"
      - "argocd/**"
      - "**/*.md"

  workflow_dispatch:



# PERMISSIONS


permissions:
  contents: write



# CONCURRENCY


concurrency:
  group: production-rag-main
  cancel-in-progress: true



# ENVIRONMENT VARIABLES


env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}


# JOBS


jobs:


  # 1. VALIDATE PYTHON SOURCE
 

  validate-python:
    name: Validate Python Source
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Validate Python syntax
        shell: bash
        run: |
          python -m compileall \
            app.py \
            main.py \
            streamlit_app1.py \
            observability_agent_api.py \
            prometheus_mcp \
            opensearch_mcp \
            agents \
            auth \
            monitoring


  
  # 2. BUILD, VERIFY, SCAN AND PUSH DOCKER IMAGES
 

  build-images:
    name: Build and Scan - ${{ matrix.service }}

    needs:
      - validate-python

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          
          # RAG Backend
          
          - service: rag-backend
            dockerfile: Dockerfile.backend

        
          # RAG Frontend
       
          - service: rag-frontend
            dockerfile: Dockerfile.frontend

         
          # Prometheus MCP Server
          
          - service: prometheus-mcp
            dockerfile: Dockerfile.prometheus-mcp

          # OpenSearch MCP Server
         
          - service: opensearch-mcp
            dockerfile: Dockerfile.opensearch-mcp

          
          # Observability Agent
         
          - service: observability-agent
            dockerfile: Dockerfile.observability-agent

          # Data Prepper
          
          - service: data-prepper
            dockerfile: Dockerfile.data-prepper


    steps:

      # Checkout
    

      - name: Checkout repository
        uses: actions/checkout@v4


   
      # Generate immutable image tag from Git commit SHA
      

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${SHORT_SHA}"


      
      # Docker Buildx
     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Docker Hub Login
      

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      
      # Build image locally
      

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}

          push: false
          load: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}

          cache-from: type=gha

          cache-to: |
            type=gha,mode=max


      - name: Verify Python package versions
        if: matrix.service == 'rag-backend'
        shell: bash
        run: |
          echo "Checking security-sensitive Python packages..."

          docker run --rm \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }} \
            python -c "
          import importlib.metadata as m

          packages = [
              'cryptography',
              'fsspec',
              'msgpack',
              'urllib3',
              'setuptools',
              'pyarrow'
          ]

          for package in packages:
              try:
                  version = m.version(package)
                  print(f'{package}={version}')
              except Exception as exc:
                  print(f'{package}=ERROR:{exc}')
          "


      # Trivy vulnerability scan HIGH or CRITICAL vulnerabilities fail the build.
     
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          scanners: "vuln"
          version: "v0.76.0"
      


      # Push only after successful security scan
   

      - name: Push image to Docker Hub
        shell: bash
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}"

          echo "Pushing ${IMAGE}"

          docker push "${IMAGE}"

  # 3. UPDATE GITOPS KUBERNETES MANIFESTS
  

  update-gitops:
    name: Update GitOps Manifests

    needs:
      - build-images

    runs-on: ubuntu-latest

    steps:

    
      # Checkout repository
   

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


     
      # Generate same image tag used during build
    

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "GitOps image tag: ${SHORT_SHA}"


     
      # Update Kubernetes Deployment manifests
    

      - name: Update Kubernetes image tags
        shell: bash
        run: |
          TAG="${{ steps.image.outputs.tag }}"
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

          echo "Updating Kubernetes manifests to ${TAG}"

          sed -i \
            "s|image: ${USERNAME}/rag-backend:.*|image: ${USERNAME}/rag-backend:${TAG}|g" \
            kubernetes/rag/rag-backend.yml

          sed -i \
            "s|image: ${USERNAME}/rag-frontend:.*|image: ${USERNAME}/rag-frontend:${TAG}|g" \
            kubernetes/rag/rag-frontend.yml

          sed -i \
            "s|image: ${USERNAME}/prometheus-mcp:.*|image: ${USERNAME}/prometheus-mcp:${TAG}|g" \
            kubernetes/rag/prometheus-mcp.yml

          sed -i \
            "s|image: ${USERNAME}/opensearch-mcp:.*|image: ${USERNAME}/opensearch-mcp:${TAG}|g" \
            kubernetes/rag/opensearch-mcp.yml

          sed -i \
            "s|image: ${USERNAME}/observability-agent:.*|image: ${USERNAME}/observability-agent:${TAG}|g" \
            kubernetes/rag/observability-agent.yml

          sed -i \
            "s|image: ${USERNAME}/data-prepper:.*|image: ${USERNAME}/data-prepper:${TAG}|g" \
            kubernetes/rag/data-prepper.yml


    
      # Verify manifest changes
    

      - name: Show updated image references
        shell: bash
        run: |
          echo "Updated Kubernetes images:"
          echo

          grep -R -n "image:" kubernetes/rag


      # Configure Git identity
   

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # Commit GitOps manifest changes
      

      - name: Commit GitOps changes
        shell: bash
        run: |
          git add kubernetes/rag/

          if git diff --cached --quiet; then
            echo "No GitOps manifest changes detected."
            exit 0
          fi

          git commit \
            -m "gitops: deploy images ${{ steps.image.outputs.tag }}"


     
      # Push manifest commit

      - name: Push GitOps changes
        shell: bash
        run: |
          if git diff HEAD origin/main --quiet; then
            echo "Nothing new to push."
            exit 0
          fi

          git push origin HEAD:main