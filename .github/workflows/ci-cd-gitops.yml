name: Production RAG CI/CD GitOps


# TRIGGERS


on:
  push:
    branches:
      - main

    # Prevent the GitOps-only commit created by this workflow from triggering another full image build.
    paths-ignore:
      - "kubernetes/**"
      - "argocd/**"
      - "**/*.md"
      - "helm/production-rag/values-prod.yaml"


  workflow_dispatch:



# PERMISSIONS


permissions:
  contents: write



# CONCURRENCY


concurrency:
  group: production-rag-main
  cancel-in-progress: true



# ENVIRONMENT VARIABLES


env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}


# JOBS


jobs:


  # 1. VALIDATE PYTHON SOURCE


  validate-python:
    name: Validate Python Source
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Validate Python syntax
        shell: bash
        run: |
          python -m compileall \
            app.py \
            main.py \
            streamlit_app1.py \
            observability_agent_api.py \
            prometheus_mcp \
            opensearch_mcp \
            agents \
            auth \
            monitoring



  # 2. BUILD, VERIFY, SCAN AND PUSH DOCKER IMAGES


  build-images:
    name: Build and Scan - ${{ matrix.service }}

    needs:
      - validate-python

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:


          # RAG Backend

          - service: rag-backend
            dockerfile: Dockerfile.backend


          # RAG Frontend

          - service: rag-frontend
            dockerfile: Dockerfile.frontend


          # Prometheus MCP Server

          - service: prometheus-mcp
            dockerfile: Dockerfile.prometheus-mcp

          # OpenSearch MCP Server

          - service: opensearch-mcp
            dockerfile: Dockerfile.opensearch-mcp


          # Observability Agent

          - service: observability-agent
            dockerfile: Dockerfile.observability-agent

          # Data Prepper

          - service: data-prepper
            dockerfile: Dockerfile.data-prepper


    steps:

      # Checkout


      - name: Checkout repository
        uses: actions/checkout@v4



      # Generate immutable image tag from Git commit SHA


      - name: Generate image tag
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${SHORT_SHA}"



      # Docker Buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Docker Hub Login


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}



      # Build image locally


      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}

          push: false
          load: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}

          cache-from: type=gha

          cache-to: |
            type=gha,mode=max


      - name: Verify Python package versions
        if: matrix.service == 'rag-backend'
        shell: bash
        run: |
          echo "Checking security-sensitive Python packages..."

          docker run --rm \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }} \
            python -c "
          import importlib.metadata as m

          packages = [
              'cryptography',
              'fsspec',
              'msgpack',
              'urllib3',
              'setuptools',
              'pyarrow'
          ]

          for package in packages:
              try:
                  version = m.version(package)
                  print(f'{package}={version}')
              except Exception as exc:
                  print(f'{package}=ERROR:{exc}')
          "


      # Trivy vulnerability scan HIGH or CRITICAL vulnerabilities fail the build.

      - name: Scan custom image with Trivy
        if: matrix.service != 'data-prepper'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          scanners: "vuln"
          version: "v0.76.0"

      # ============================================================
      # Data Prepper is an upstream third-party Java distribution.

      - name: Scan Data Prepper with Trivy
        if: matrix.service == 'data-prepper'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          scanners: "vuln"
          version: "v0.76.0"




      # Push only after successful security scan


      - name: Push image to Docker Hub
        shell: bash
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}"

          echo "Pushing ${IMAGE}"

          docker push "${IMAGE}"

  # 3. UPDATE GITOPS KUBERNETES MANIFESTS


  update-gitops:
    name: Update GitOps Manifests

    needs:
      - build-images

    runs-on: ubuntu-latest

    steps:


      # Checkout repository


      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      # Generate same image tag used during build


      - name: Generate image tag
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "GitOps image tag: ${SHORT_SHA}"



      # Update Helm production image tags

      - name: Update Helm production image tags
        shell: bash
        run: |
          TAG="${{ steps.image.outputs.tag }}"
          VALUES_FILE="helm/production-rag/values-prod.yaml"

          echo "Updating Helm production image tags to ${TAG}"

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"]
          path = Path("helm/production-rag/values-prod.yaml")

          services = {
              "backend",
              "frontend",
              "prometheusMcp",
              "opensearchMcp",
              "observabilityAgent",
              "dataPrepper",
          }

          lines = path.read_text().splitlines()

          current_service = None
          inside_image = False
          updated = set()

          output = []

          for line in lines:
              # Detect top-level YAML section
              top_level = re.match(r"^([A-Za-z0-9_-]+):\s*$", line)

              if top_level:
                  section = top_level.group(1)

                  if section in services:
                      current_service = section
                  else:
                      current_service = None

                  inside_image = False

              # Detect image: under one of our services
              if current_service and re.match(r"^\s{2}image:\s*$", line):
                  inside_image = True
                  output.append(line)
                  continue

              # Replace image tag
              if (
                  current_service
                  and inside_image
                  and re.match(r"^\s{4}tag:\s*", line)
              ):
                  output.append(f'    tag: "{tag}"')
                  updated.add(current_service)
                  inside_image = False
                  continue

              output.append(line)

          missing = services - updated

          if missing:
              raise SystemExit(
                  "Failed to update image tags for: "
                  + ", ".join(sorted(missing))
              )

          path.write_text("\n".join(output) + "\n")

          print("Updated image tags:")
          for service in sorted(updated):
              print(f"  {service}: {tag}")
          PY
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}

      # Show updated Helm image tags

      - name: Show updated Helm values
        shell: bash
        run: |
          echo "Updated production Helm values:"
          echo

          grep -n -A3 "^backend:" \
            helm/production-rag/values-prod.yaml

          grep -n -A3 "^frontend:" \
            helm/production-rag/values-prod.yaml

          grep -n -A3 "^prometheusMcp:" \
            helm/production-rag/values-prod.yaml

          grep -n -A3 "^opensearchMcp:" \
            helm/production-rag/values-prod.yaml

          grep -n -A3 "^observabilityAgent:" \
            helm/production-rag/values-prod.yaml

          grep -n -A3 "^dataPrepper:" \
            helm/production-rag/values-prod.yaml

      # Install Helm

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      # Validate Helm chart before GitOps commit

      - name: Validate Helm chart
        shell: bash
        run: |
          echo "Running Helm lint..."

          helm lint ./helm/production-rag \
            -f ./helm/production-rag/values-prod.yaml

          echo
          echo "Rendering production manifests..."

          helm template production-rag \
            ./helm/production-rag \
            -f ./helm/production-rag/values-prod.yaml \
            > /tmp/production-rag-rendered.yaml

          echo
          echo "Helm validation successful."

          echo
          echo "Rendered images:"

          grep "image:" /tmp/production-rag-rendered.yaml

      # Configure Git identity

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # Commit Helm GitOps change

      - name: Commit GitOps changes
        shell: bash
        run: |
          git add helm/production-rag/values-prod.yaml

          if git diff --cached --quiet; then
            echo "No Helm GitOps changes detected."
            exit 0
          fi

          git commit \
            -m "gitops: deploy images ${{ steps.image.outputs.tag }}"


      # Push GitOps commit

      - name: Push GitOps changes
        shell: bash
        run: |
          if git diff HEAD origin/main --quiet; then
            echo "Nothing new to push."
            exit 0
          fi

          git push origin HEAD:main