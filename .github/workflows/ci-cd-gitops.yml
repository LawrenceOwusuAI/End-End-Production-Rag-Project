name: Production RAG CI/CD GitOps

# TRIGGERS: Run when application/source code is pushed to main.
on:
  push:
    branches:
      - main

    paths-ignore:
      - "kubernetes/**"
      - "argocd/**"
      - "**/*.md"

  workflow_dispatch:

# PERMISSIONS
permissions:
  contents: write

# PREVENT MULTIPLE DEPLOYMENTS FROM RACING EACH OTHER
concurrency:
  group: production-rag-main
  cancel-in-progress: false

jobs:

  # JOB 1: VALIDATE SOURCE CODE
  validate:
    name: Validate Python Source
    runs-on: ubuntu-latest

    # Only deploy from main.
    if: github.ref == 'refs/heads/main'

    steps:

      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Python syntax validation. 
      - name: Check Python syntax
        run: |
          python -m compileall \
            app.py \
            main.py \
            streamlit_app1.py \
            observability_agent_api.py \
            prometheus_mcp \
            opensearch_mcp \
            agents \
            auth \
            monitoring

          echo "Python syntax validation passed."

  # JOB 2: BUILD + SECURITY SCAN + PUSH IMAGES
  build-images:
    name: Build and Scan - ${{ matrix.service }}

    runs-on: ubuntu-latest

    needs:
      - validate

    strategy:

      # If one image fails, allow the other matrix jobs to finish so we can see all failures.
      fail-fast: false

      matrix:
        include:

          # RAG Backend
          - service: rag-backend
            dockerfile: Dockerfile.backend

          # Streamlit Frontend
          - service: rag-frontend
            dockerfile: Dockerfile.frontend

          # Prometheus MCP Server
          - service: prometheus-mcp
            dockerfile: Dockerfile.prometheus-mcp

          # OpenSearch MCP Server
          - service: opensearch-mcp
            dockerfile: Dockerfile.opensearch-mcp

          # Observability Agent
          - service: observability-agent
            dockerfile: Dockerfile.observability-agent

          # Data Prepper
          - service: data-prepper
            dockerfile: Dockerfile.data-prepper

    steps:

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Docker image tag: ${SHORT_SHA}"

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with Docker Hub DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # We do NOT push the image yet. First we scan it with Trivy.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}

          push: false
          load: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy vulnerability scan. HIGH or CRITICAL vulnerabilities cause the job to fail.
      # --ignore-unfixed means we do not block deployment for vulnerabilities for which no fix is currently available.
      
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:

          image-ref: >-
            ${{ secrets.DOCKERHUB_USERNAME }}/${{
            matrix.service }}:${{
            steps.image.outputs.tag }}

          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      # Push only after security scan succeeds
      - name: Push Docker image
        shell: bash
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}"
          echo "Pushing: ${IMAGE}"
          docker push "${IMAGE}"

  # JOB 3: UPDATE GITOPS MANIFESTS
  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest

    # This job cannot run unless ALL six matrix builds succeed.
    needs:
      - build-images

    steps:

      # Checkout current main branch
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Generate same SHA tag used when building images
      - name: Generate deployment tag
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "GitOps deployment tag: ${SHORT_SHA}"

      # Update Kubernetes manifests
      - name: Update Kubernetes image tags
        shell: bash
        run: |
          TAG="${{ steps.image.outputs.tag }}"
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "Updating Kubernetes manifests to ${TAG}"

          # RAG Backend
          sed -i -E \
            "s|image: .*/rag-backend:[^[:space:]]+|image: ${USER}/rag-backend:${TAG}|" \
            kubernetes/rag/rag-backend.yml

          # RAG Frontend
          sed -i -E \
            "s|image: .*/rag-frontend:[^[:space:]]+|image: ${USER}/rag-frontend:${TAG}|" \
            kubernetes/rag/rag-frontend.yml

          # Prometheus MCP
          sed -i -E \
            "s|image: .*/prometheus-mcp:[^[:space:]]+|image: ${USER}/prometheus-mcp:${TAG}|" \
            kubernetes/rag/prometheus-mcp.yml

          # OpenSearch MCP
          sed -i -E \
            "s|image: .*/opensearch-mcp:[^[:space:]]+|image: ${USER}/opensearch-mcp:${TAG}|" \
            kubernetes/rag/opensearch-mcp.yml

          # Observability Agent
          sed -i -E \
            "s|image: .*/observability-agent:[^[:space:]]+|image: ${USER}/observability-agent:${TAG}|" \
            kubernetes/rag/observability-agent.yml

          # Data Prepper
          sed -i -E \
            "s|image: .*/data-prepper:[^[:space:]]+|image: ${USER}/data-prepper:${TAG}|" \
            kubernetes/rag/data-prepper.yml

      # Verification of manifests
      - name: Show updated image references
        shell: bash
        run: |
          echo "Kubernetes images after update"
          grep -R -n "image:" kubernetes/rag

      - name: Show Git diff
        shell: bash
        run: |
          echo "GitOps manifest changes"
          git diff -- kubernetes/rag/

      # Commit desired state back to GitHub and Argo CD performs the deployment.
      - name: Commit and push GitOps changes
        shell: bash
        run: |
          TAG="${{ steps.image.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            kubernetes/rag/rag-backend.yml \
            kubernetes/rag/rag-frontend.yml \
            kubernetes/rag/prometheus-mcp.yml \
            kubernetes/rag/opensearch-mcp.yml \
            kubernetes/rag/observability-agent.yml \
            kubernetes/rag/data-prepper.yml

          # Do nothing if image tags are already correct.
    
          if git diff --cached --quiet; then
            echo "No GitOps manifest changes detected."
            exit 0
          fi

          # Commit new desired Kubernetes state
          git commit \
            -m "deploy: update RAG images to ${TAG}"

          # Rebase in case main changed while images were building
          git pull --rebase origin main

          # Push GitOps commit
          git push origin main
          echo "GitOps manifests successfully updated."