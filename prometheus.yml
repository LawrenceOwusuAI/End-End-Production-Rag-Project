
# GLOBAL SETTINGS

global:
  scrape_interval: 15s
  evaluation_interval: 15s


rule_files:
  - "/etc/prometheus/alert_rules.yml"


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"


scrape_configs:

  - job_name: "rag-api"
    static_configs:
      - targets:
          - "otel-collector:9464"


  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

