{{- if .Values.postgresql.enabled }}

apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.postgresql.service.name }}
  namespace: rag

spec:
  type: ClusterIP

  selector:
    app: postgresql

  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP

{{- end }}