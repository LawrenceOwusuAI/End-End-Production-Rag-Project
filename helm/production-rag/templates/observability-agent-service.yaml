apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.observabilityAgent.name }}
  namespace: {{ .Values.namespace }}

spec:
  type: {{ .Values.observabilityAgent.service.type }}

  selector:
    app: {{ .Values.observabilityAgent.name }}

  ports:
    - name: http
      port: {{ .Values.observabilityAgent.service.port }}
      targetPort: {{ .Values.observabilityAgent.service.targetPort }}