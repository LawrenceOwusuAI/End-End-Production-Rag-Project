# PRODUCTION ENVIRONMENT OVERRIDES


backend:
  replicaCount: 1

  image:
    tag: "1482ccee22fa"


frontend:
  replicaCount: 1

  image:
    tag: "1482ccee22fa"

  service:
    nodePort: 30501


prometheusMcp:
  replicaCount: 1

  image:
    tag: "1482ccee22fa"


opensearchMcp:
  replicaCount: 1

  image:
    tag: "1482ccee22fa"


observabilityAgent:
  replicaCount: 1

  image:
    tag: "1482ccee22fa"


dataPrepper:
  replicaCount: 1

  image:
    tag: "1482ccee22fa"


configMap:
  data:
    ENVIRONMENT: "production"
    LOG_LEVEL: "INFO"


postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    name: postgresql
    port: 5432

  database: rag_auth
  username: rag_user

  storage:
    size: 10Gi

    storageClassName: "gp3"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

    limits:
      cpu: "500m"
      memory: "512Mi"